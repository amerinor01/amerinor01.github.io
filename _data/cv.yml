    - title: Research Assistant
      institution: University of Castilla-La Mancha
      location: Albacete, Spain
      year: 04.2021 - Present
      description:
        - Designed and implemented performance-critical congestion-control algorithms for RoCEv2 data-center networks, combining 3+ algorithms and reducing 99th-percentile tail latency by up to 30% and mean latency by 40% for bursty traffic, using C++ and event-based simulation to evaluate scalability, latency, and throughput.
        - Optimized a cycle-accurate, event-based network simulator and its synthetic traffic generation pipeline, cutting traffic-trace processing time by 50% and generated events by 20% without compromising data accuracy.
        - Co-authored scientific publications and presented technical findings on network optimization to international audiences.

