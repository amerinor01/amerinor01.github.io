      location: Zurich, Switzerland
      year: 04.2026 - 09.2026
      description:
        - Extended the schema of a programmable congestion-control mechanism to support receiver-based CC techniques, to enable more flexible flow-control policies for data-center networks.
        - Conducted a fair, standardized comparison of 5+ congestion-control techniques and applied hyperparameter optimization to tune each algorithm's parameters, improving performance by up to 25% (preliminary) over default configurations.

